<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shizenryu Daily Practice</title>
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<style>
  :root{ --red:#C8102E; --dark:#161616; --paper:#faf7f2; --gold:#9A7D00; --good:#1e8a4c; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--paper); color:#222;
       min-height:100vh; display:flex; justify-content:center;}
  .app{width:100%; max-width:520px; padding:20px 16px 40px;}
  header{text-align:center; margin-bottom:14px;}
  header h1{font-size:1.3rem; letter-spacing:.12em; color:var(--dark);}
  header .sub{font-size:.72rem; letter-spacing:.2em; color:var(--red); text-transform:uppercase; margin-top:4px;}
  #streakChip{font-size:.75rem; color:var(--gold); margin-top:6px; min-height:1em;}
  .card{background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:18px; margin-bottom:14px;}
  .today{font-size:.78rem; letter-spacing:.15em; color:#999; text-transform:uppercase;}
  .status{margin:8px 0 14px; font-size:.95rem; font-weight:600; min-height:1.4em;}
  .status.done{color:var(--good);}
  .status.none{color:#888; font-weight:400;}
  .acts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .act{border:2px solid #e5e0d8; background:#fff; border-radius:12px; padding:13px 12px;
    text-align:left; cursor:pointer; transition:border-color .12s, background .12s;}
  .act .n{font-weight:700; font-size:.92rem; color:var(--dark);}
  .act .h{font-size:.72rem; color:#999; margin-top:3px; line-height:1.3;}
  .act.on{border-color:var(--good); background:#e9f7ef;}
  .act.on .n::after{content:" ✓"; color:var(--good);}
  h2{font-size:.78rem; letter-spacing:.2em; color:#999; text-transform:uppercase; margin:20px 0 10px;}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; text-align:center;}
  .day .dot{width:34px; height:34px; margin:0 auto 5px; border-radius:50%; border:2px solid #e5e0d8;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; color:#bbb;}
  .day.hit .dot{background:var(--good); border-color:var(--good); color:#fff;}
  .day.today .dot{border-color:var(--red);}
  .day .lbl{font-size:.62rem; letter-spacing:.05em; color:#999; text-transform:uppercase;}
  .summary{font-size:.82rem; color:#777; margin-top:12px; text-align:center;}
  .mind{background:#fbf7f1; border-left:4px solid var(--gold); padding:12px 14px;
    font-size:.85rem; font-style:italic; color:#555; border-radius:0 10px 10px 0; margin-top:14px;}
  footer{text-align:center; font-size:.7rem; color:#bbb; margin-top:20px;}
  footer a{color:#999;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>DAILY PRACTICE</h1>
    <div class="sub">One thing a day is enough</div>
    <div id="streakChip"></div>
  </header>

  <div class="card">
    <div class="today" id="todayLbl"></div>
    <div class="status none" id="status"></div>
    <div class="acts" id="acts"></div>

    <h2>This week</h2>
    <div class="week" id="week"></div>
    <div class="summary" id="summary"></div>

    <div class="mind">A stretch counts. One kata counts. Anything you want to remain in your
      life must be cultivated — a little, often, beats a lot, rarely.</div>
  </div>

  <footer><a href="index.html">← Shizenryu home</a><br>Structure &gt; Discipline &gt; Measure = Growth</footer>
</div>

<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script>
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const done = Store.todayPractice();

  const d = new Date();
  document.getElementById('todayLbl').textContent =
    'TODAY — ' + d.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});

  const status = document.getElementById('status');
  if(done.length === 0){
    status.className = 'status none';
    status.textContent = 'Nothing yet — pick one thing. Even a stretch keeps the streak.';
  } else {
    status.className = 'status done';
    status.textContent = done.length + ' thing' + (done.length === 1 ? '' : 's') + ' done today — streak kept ✓';
  }

  const box = document.getElementById('acts');
  box.innerHTML = '';
  PRACTICE.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'act' + (done.includes(a.id) ? ' on' : '');
    b.innerHTML = '<div class="n">'+esc(a.name)+'</div><div class="h">'+esc(a.hint)+'</div>';
    b.onclick = ()=>toggle(a.id);
    box.appendChild(b);
  });

  const week = document.getElementById('week');
  week.innerHTML = '';
  const t = Store.today();
  let hits = 0, monthHits = 0;
  for(let i = 29; i >= 0; i--){
    if(Store.practiceOn(t - i).length > 0) monthHits++;
  }
  for(let i = 6; i >= 0; i--){
    const dayNum = t - i;
    const acts = Store.practiceOn(dayNum);
    const hit = acts.length > 0;
    if(hit) hits++;
    const dd = new Date(dayNum * 86400000);
    const el = document.createElement('div');
    el.className = 'day' + (hit ? ' hit' : '') + (i === 0 ? ' today' : '');
    el.innerHTML = '<div class="dot">' + (hit ? acts.length : '·') + '</div>' +
                   '<div class="lbl">' + dd.toLocaleDateString(undefined,{weekday:'short'}) + '</div>';
    week.appendChild(el);
  }
  document.getElementById('summary').textContent =
    'Practised on ' + hits + ' of the last 7 days · ' + monthHits + ' of the last 30.';

  const s = Store.streakInfo();
  document.getElementById('streakChip').textContent =
    s.count >= 1 ? '🔥 ' + s.count + '-day streak' + (s.today ? '' : ' — train today to keep it') : '';
}

function toggle(id){
  const done = Store.todayPractice();
  if(done.includes(id)){
    Store.unlogPractice(id);
  } else {
    Store.logPractice(id);
    Store.markTrained();          // any single activity keeps the streak
  }
  render();
}

render();
</script>
</body>
</html>
