<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shizenryu Kata Reference</title>
<link rel="icon" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<style>
  :root{ --red:#C8102E; --dark:#161616; --paper:#faf7f2; --gold:#9A7D00; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--paper); color:#222;
       min-height:100vh; display:flex; justify-content:center;}
  .app{width:100%; max-width:560px; padding:20px 16px 40px;}
  header{text-align:center; margin-bottom:18px;}
  header h1{font-size:1.3rem; letter-spacing:.12em; color:var(--dark);}
  header .sub{font-size:.72rem; letter-spacing:.2em; color:var(--red); text-transform:uppercase; margin-top:4px;}
  .card{background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:18px; margin-bottom:14px;}
  .tiles{display:grid; gap:10px;}
  .kata-btn{border:none; border-radius:10px; padding:16px; cursor:pointer; text-align:left;
    color:#fff; transition:transform .08s;}
  .kata-btn:active{transform:scale(.97);}
  .kata-btn .n{font-size:1.1rem; font-weight:800; letter-spacing:.04em;}
  .kata-btn .t{font-size:.75rem; opacity:.85; margin-top:2px;}
  .banner{border-radius:12px; padding:16px 18px; margin-bottom:14px; color:#fff;}
  .banner .n{font-size:1.4rem; font-weight:800; letter-spacing:.04em;}
  .banner .t{font-size:.78rem; opacity:.85; letter-spacing:.1em; text-transform:uppercase; margin-top:2px;}
  h2{font-size:.78rem; letter-spacing:.2em; color:#999; text-transform:uppercase; margin:18px 0 8px;}
  .body{font-size:.9rem; line-height:1.6; color:#333;}
  .quote{background:#fbf7f1; border-left:4px solid var(--red); padding:12px 14px; font-style:italic;
    font-size:.88rem; color:#555; border-radius:0 10px 10px 0; margin:14px 0;}
  .quote .src{display:block; font-style:normal; font-size:.7rem; color:var(--gold); margin-top:5px; letter-spacing:.08em;}
  .syl{padding:8px 0; border-bottom:1px solid #f0ebe2; font-size:.85rem;}
  .syl:last-child{border-bottom:none;}
  .syl .g{display:inline-block; min-width:64px; font-weight:700; font-size:.72rem;
    color:var(--red); letter-spacing:.05em;}
  .syl .tag{font-size:.6rem; font-weight:700; padding:2px 6px; border-radius:6px; color:#fff; margin-left:6px;}
  .tag.adult{background:#0072CE;} .tag.junior{background:#ED8B00;}
  .nav{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .nav button{padding:12px; border:2px solid var(--dark); background:#fff; color:var(--dark);
    border-radius:10px; font-weight:600; font-size:.9rem; cursor:pointer;}
  .nav button:disabled{opacity:.3; cursor:default;}
  .home-link{display:block; text-align:center; margin-top:16px; font-size:.8rem; color:#999;
    background:none; border:none; cursor:pointer; width:100%;}
  footer{text-align:center; font-size:.7rem; color:#bbb; margin-top:20px;}
  footer a{color:#999;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>KATA REFERENCE</h1>
    <div class="sub">The root forms of Shizenryu</div>
  </header>

  <div id="menu">
    <div class="card">
      <p style="font-size:.85rem; color:#666; margin-bottom:14px; text-align:center;">
        Four kata carry the art: one to build you, one to root you,<br>one to free your hands, one to close the distance.</p>
      <div class="tiles" id="kataList"></div>
    </div>
  </div>

  <div id="view" class="hidden">
    <div class="banner" id="banner"><div class="n" id="kName"></div><div class="t" id="kTrans"></div></div>
    <div class="card">
      <div id="sections"></div>
      <div class="quote hidden" id="quote"><em id="qText"></em><span class="src" id="qSrc"></span></div>
      <h2>In the syllabus</h2>
      <div id="syl"></div>
      <div class="nav">
        <button id="prevBtn" onclick="step(-1)">← Previous</button>
        <button id="nextBtn" onclick="step(1)">Next →</button>
      </div>
      <button class="home-link" onclick="goMenu()">← all kata</button>
    </div>
  </div>

  <footer><a href="index.html">← Shizenryu home</a><br>Structure &gt; Discipline &gt; Measure = Growth</footer>
</div>

<script src="assets/data.js"></script>
<script>
let cur = -1;

function init(){
  const list = document.getElementById('kataList');
  KATA.forEach((k,i)=>{
    const b = document.createElement('button');
    b.className = 'kata-btn';
    b.style.background = k.hex;
    b.innerHTML = '<div class="n">'+esc(k.name)+'</div><div class="t">'+esc(k.translation)+'</div>';
    b.onclick = ()=>openKata(i, true);
    list.appendChild(b);
  });
  const slug = location.hash.replace('#','');
  const i = KATA.findIndex(k=>k.slug===slug);
  if(i >= 0) openKata(i, false);
}

function openKata(i, setHash){
  cur = i;
  const k = KATA[i];
  if(setHash) location.hash = k.slug;
  document.getElementById('banner').style.background = k.hex;
  document.getElementById('kName').textContent = k.name;
  document.getElementById('kTrans').textContent = k.translation;

  const box = document.getElementById('sections');
  box.innerHTML = '';
  k.sections.forEach((s,idx)=>{
    const h = document.createElement('h2');
    if(idx===0) h.style.marginTop = '0';
    h.textContent = s.h;
    const p = document.createElement('div');
    p.className = 'body';
    p.innerHTML = s.b;              // trusted HTML authored in data.js
    box.appendChild(h); box.appendChild(p);
  });

  const q = document.getElementById('quote');
  if(k.quote){
    q.classList.remove('hidden');
    document.getElementById('qText').textContent = '“' + k.quote.text + '”';
    document.getElementById('qSrc').textContent = '— ' + k.quote.src;
  } else q.classList.add('hidden');

  const syl = document.getElementById('syl');
  syl.innerHTML = '';
  SYLLABUS.filter(s=>{
    const blob = (s.section+' '+s.item+' '+s.detail).toLowerCase();
    return k.match.some(m=>blob.includes(m));
  }).forEach(s=>{
    const d = document.createElement('div');
    d.className = 'syl';
    let html = '<span class="g">'+esc(s.grade)+'</span> '+esc(s.item);
    if(s.track==='Adult') html += '<span class="tag adult">ADULTS 16+</span>';
    if(s.track==='Junior') html += '<span class="tag junior">JUNIORS</span>';
    d.innerHTML = html;
    syl.appendChild(d);
  });

  document.getElementById('prevBtn').disabled = (i === 0);
  document.getElementById('nextBtn').disabled = (i === KATA.length-1);
  show('view');
  window.scrollTo(0,0);
}

function step(d){ openKata(cur + d, true); }
function goMenu(){ history.replaceState(null,'',location.pathname); show('menu'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(id){
  ['menu','view'].forEach(s=>document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
init();
</script>
</body>
</html>
