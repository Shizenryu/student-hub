[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/belts.html"
  to = "/belts"
  status = 301

[[redirects]]
  from = "/kata.html"
  to = "/kata"
  status = 301

[[redirects]]
  from = "/practice.html"
  to = "/practice"
  status = 301

[[redirects]]
  from = "/flashcards.html"
  to = "/flashcards"
  status = 301

# Unlike every other rule here, the home page's old URL still resolves to a real built
# file — Astro emits the root route as dist/index.html — so without `force` a
# request for /index.html would serve that file directly and the rule would
# never fire. Forcing it keeps one canonical home URL. `/` is not matched by
# this rule, so there is no redirect loop.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
