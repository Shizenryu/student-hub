[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/belts.html"
  to = "/belts"
  status = 301

[[redirects]]
  from = "/kata.html"
  to = "/kata"
  status = 301

[[redirects]]
  from = "/practice.html"
  to = "/practice"
  status = 301

[[redirects]]
  from = "/flashcards.html"
  to = "/flashcards"
  status = 301

[[redirects]]
  from = "/quiz.html"
  to = "/quiz"
  status = 301

# Unlike every other rule here, the home page's old URL still resolves to a real built
# file — Astro emits the root route as dist/index.html — so without `force` a
# request for /index.html would serve that file directly and the rule would
# never fire. Forcing it keeps one canonical home URL. `/` is not matched by
# this rule, so there is no redirect loop.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Security headers for every response. The Content-Security-Policy here is
# deliberately only frame-ancestors: the rest of the policy — the part that
# needs a hash per page for Astro's island bootstrap and inlined styles — is
# generated by Astro at build time as a <meta> on every page (see
# astro.config.mjs). A <meta> cannot carry frame-ancestors, so it lives here;
# two policies intersect, nothing loosens. X-Frame-Options stays alongside it
# for browsers that predate CSP 2.
#
# Each value must be a one-line basic string: an HTTP header value cannot hold
# a newline, and tests/support/netlify-headers.ts (which both test suites read
# this file through) refuses any other TOML string form so the mistake fails
# in a test rather than at the edge. tests/build/security-headers.test.ts pins
# every value below; tests/deploy/csp-violations.test.ts serves the built pages
# with them to a real browser. Whether Netlify applies /* to its 404 responses
# is confirmed by hand with curl after deploy, not assumed — see CLAUDE.md.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Astro names everything under /_astro/ by content hash, so a changed file is a
# new URL and the old one can be cached for as long as a browser likes. Without
# this, Netlify's default is max-age=0 and every navigation re-validates the
# island chunks the student's phone already has.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
