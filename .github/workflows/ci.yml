name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Node tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      # The built pages, served with the exact headers netlify.toml declares, in
      # the Chromium installed above: fails on any Content-Security-Policy
      # violation before the policy can reach a student's phone.
      - name: Deploy tests
        run: npm run test:deploy

      # Last, because it fails on the advisory database moving rather than on
      # anything in the diff. Running it here keeps a new advisory from masking
      # a genuine test failure, while still blocking the merge.
      - name: Audit dependencies
        run: npm audit --audit-level=high
